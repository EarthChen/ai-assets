name: CI

# Runs the installer test suite: the golden test (committed _dist/ equals a
# fresh build), the third-party.json schema check and the skill path checks.
# Submodules are not checked out: the tests need none, and vendor/momo-tools
# is private.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - run: uv run pytest
