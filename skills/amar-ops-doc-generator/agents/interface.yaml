# Scaffold：本项目内开发验证，成型后整目录迁至 ~/.agents/skills/
# （pi 发现 ~/.agents/skills/ 与 .agents/skills/；.cursor/skills/ 仅 cursor 使用）

interface:
  display_name: 上线配套文档生成器
  short_description: 基于分支 diff 生成后门 bsh 测试文档、动态配置变更清单、多语言文案变更清单、Melon 配置变更说明。
  default_prompt: 手动调用：为当前分支生成后门 bsh 测试文档 / MSE 配置变更清单 / Melon 路由说明（可指定其一）。

compatibility:
  canonical_format: markdown-skill
  adapter_targets:
    - pi
    - cursor
  activation:
    mode: manual
    paths: []
  execution:
    context: inline
    shell: bash
  trust:
    source_tier: local
    remote_inline_execution: forbid
    remote_metadata_policy: none
  degradation:
    pi: disable-model-invocation 已声明，仅 /skill:amar-ops-doc-generator 显式调用；
      只读 git 与文档写入，无远程执行。
    cursor: 不支持该 frontmatter 字段，靠 description 声明手动语义兑底；
      .cursor/skills 目录内使用时路径解析基于当前工程。
